<!DOCTYPE html>
<html>

<head>
    <title>Add Property</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css', v='1') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/property.css', v='1') }}">
</head>

<body>
    <div class="center">
        <div class="navbar">
            <h1>Add Property</h1>
            <nav>
                <a href="/">Home</a>
                <a href="/dealer/dashboard">Dashboard</a>
                <a href="/logout">Logout</a>
            </nav>
        </div>

        <div class="container">
            <div class="form-card">
                <h2 style="margin-bottom: 2rem;">Add New Property</h2>
                <form method="POST">
                    <div class="form-group full">
                        <label>Property Title *</label>
                        <input type="text" name="title" required>
                    </div>

                    <div class="form-group full">
                        <label>Description</label>
                        <textarea name="description"></textarea>
                    </div>

                    <h3>Location Details</h3>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Address *</label>
                            <input type="text" name="address" required>
                        </div>
                        <div class="form-group">
                            <label>City *</label>
                            <input type="text" name="city" required>
                        </div>
                        <div class="form-group">
                            <label>State *</label>
                            <input type="text" name="state" required value="Uttarakhand">
                        </div>
                        <div class="form-group">
                            <label>Pincode</label>
                            <input type="text" name="pincode">
                        </div>
                    </div>

                    <h3>Dimensions</h3>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Length (feet) *</label>
                            <input type="number" step="any" name="length" required id="length" oninput="calc()">
                        </div>
                        <div class="form-group">
                            <label>Width (feet) *</label>
                            <input type="number" step="any" name="width" required id="width" oninput="calc()">
                        </div>
                        <div class="form-group full">
                            <div class="calc-result" id="area">Area will be calculated</div>
                        </div>
                    </div>

                    <h3>Pricing</h3>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Price per Square Yard (₹) *</label>
                            <input type="number" step="any" name="price_per_sqyard" required id="price"
                                oninput="calc()">
                        </div>
                        <div class="form-group">
                            <div class="calc-result" id="total" style="margin-top: 1.8rem;">Total: ₹0</div>
                        </div>
                    </div>

                    <h3>Features</h3>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Boundary Type</label>
                            <select name="boundary_type">
                                <option value="">Select</option>
                                <option value="Wall">Wall</option>
                                <option value="Fence">Fence</option>
                                <option value="Open">Open</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Road Type</label>
                            <select name="road_type">
                                <option value="">Select</option>
                                <option value="Paved">Paved</option>
                                <option value="Kuccha">Kuccha</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label><input type="checkbox" name="water_access" value="1"> Water Access</label>
                            <label><input type="checkbox" name="electricity" value="1"> Electricity</label>
                        </div>
                    </div>

                    <div class="form-group full">
                        <button type="submit" class="btn">Add Property</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/add_property.js', v='1') }}"></script>
</body>

</html>
